<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 · AI 小样集市</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="dot"></span>AI 小样集市</div>
    <nav><a href="/">首页</a><a href="/studio.html">创作者</a><a href="/review.html">审核台</a><a href="/#about">关于</a></nav>
    <div class="search"><input placeholder="搜索小样 / 关键词" onkeydown="if(event.key==='Enter')location.href='/?q='+encodeURIComponent(this.value)"></div>
    <button class="btn-login" onclick="location.href='/login.html'">登录</button>
  </div>
</header>

<div style="max-width:1180px;margin:24px auto;padding:0 24px">
  <h2 style="margin-bottom:6px">📊 数据看板 <span style="font-size:13px;color:#10B981" id="live">● 实时</span></h2>
  <p style="color:#6B7280;font-size:13px;margin-bottom:18px">体验漏斗：曝光 → 体验 → 反馈 · 多端通过 SSE 实时同步</p>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px" id="cards"></div>

  <h3 style="margin:28px 0 10px">📥 实时反馈流</h3>
  <div id="feed" style="background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:14px;min-height:120px"></div>
  <p style="color:#6B7280;font-size:12px;margin-top:8px">本页为内部演示用看板，正式版将接入登录权限与审核台。</p>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
